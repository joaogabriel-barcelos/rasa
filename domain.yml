version: "3.1"

intents:
  - saudacao
  - despedida
  - agradecer
  - fora_de_escopo
  - perguntar_gratuidade
  - perguntar_certificado
  - perguntar_cursos_disponiveis
  - perguntar_tempo_acesso
  - perguntar_acesso_basico
  - perguntar_acesso_pago
  - perguntar_diferenca_planos

entities:
  - curso

slots:
  curso:
    type: text
    mappings:
    - type: from_entity
      entity: curso

responses:
  utter_saudacao:
  - text: "Olá! Sou o assistente virtual da plataforma de ensino. Como posso te ajudar com seus estudos hoje?"

  utter_despedida:
  - text: "Até logo! Bons estudos!"

  utter_de_nada:
  - text: "Por nada! Se precisar de mais alguma coisa, é só chamar."

  utter_fora_de_escopo:
  - text: "Desculpe, meu foco é ajudar com dúvidas sobre a nossa plataforma de ensino. Posso te ajudar com certificados, acessos ou cursos?"

  utter_resposta_gratuidade:
  - text: "O acesso básico à nossa plataforma é 100% gratuito! Você pode assistir às aulas e emitir certificados sem pagar nada."

  utter_resposta_acesso_basico:
  - text: "O acesso básico garante acesso ilimitado a todas as videoaulas, materiais de apoio para download e emissão de certificado ao concluir o curso!"

  utter_resposta_certificado:
  - text: "Ao concluir 100% das aulas de qualquer curso, o certificado fica disponível para download na aba 'Meus Certificados'."

  utter_resposta_cursos_disponiveis:
  - text: "Temos cursos nas áreas de Programação (Python, Web), Gestão, Marketing e Design. Você pode ver a lista completa na aba 'Cursos'."

  utter_resposta_tempo_acesso:
  - text: "O acesso aos nossos cursos gratuitos fica liberado por 1 ano (12 meses) a partir da data de matrícula. Estude no seu próprio ritmo!"

  utter_resposta_acesso_pago:
  - text: "Os valores dos nossos cursos premium e especializações variam conforme a formação escolhida. Aceitamos pagamento à vista (com desconto) ou parcelado no cartão de crédito. Para receber uma proposta detalhada, por favor, entre em contato com o nosso time comercial!"

  utter_resposta_diferenca_planos:
  - text: "O acesso gratuito (básico) já garante videoaulas ilimitadas, materiais para download e certificado ao concluir o curso. O acesso pago (premium) libera cursos e especializações extras, com pagamento à vista (com desconto) ou parcelado no cartão. Ou seja: o básico cobre o essencial sem custo, e o pago é pra quem quer conteúdo avançado ou uma formação específica."

  utter_default:
  - text: "Desculpe, não consegui entender. Você poderia perguntar de outra forma ou usar palavras mais simples?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
