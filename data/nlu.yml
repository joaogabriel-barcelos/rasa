version: "3.1"

nlu:
- intent: perguntar_gratuidade
  examples: |
    - É de graça para sempre?
    - Até quando posso usar a conta gratuita?
    - Preciso pagar algum valor para usar?
    - Quanto custa a plataforma?
    - Tem algum custo?
    - O acesso ao curso é gratuito?
    - Precisa pagar para fazer os cursos?
    - Quanto custa para estudar aqui?
    - É pago?

- intent: perguntar_certificado
  examples: |
    - Como faço para emitir meu certificado?
    - Onde baixo o certificado do curso?
    - Como recebo meu comprovante de conclusão?
    - O curso dá direito a certificado gratuito?
    - Quero o meu certificado de [python](curso)
    - Quero o meu certificado
    - O curso de [Gestão](curso) dá direito a certificado?
    - Como pego meu diploma?

- intent: perguntar_cursos_disponiveis
  examples: |
    - Quais cursos tem disponíveis?
    - Cursos
    - Quais são os cursos da plataforma?
    - Quais opções de aulas vocês têm?
    - O que posso estudar aqui?
    - Acesso ao curso

- intent: saudacao
  examples: |
    - oi
    - ola
    - bom dia
    - boa tarde
    - olá, bom dia

- intent: despedida
  examples: |
    - tchau
    - ate logo
    - muito obrigado, tchau

- intent: agradecer
  examples: |
    - obrigado
    - valeu
    - muito obrigada

- intent: fora_de_escopo
  examples: |
    - qual a previsao do tempo para hoje?
    - qual a previsão do tempo hoje?
    - você gosta de pizza?
    - quem vai ganhar o jogo hoje?
